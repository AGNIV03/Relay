# CI: build + unit tests for the three codebases. Needs no secrets, no database
# and no Docker: the server tests fake the few Prisma calls they need and point
# DATABASE_URL at a closed port. Release builds (signed APKs, Windows bundles)
# are not built here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Dummies: `prisma generate` evaluates DATABASE_URL in prisma.config.ts but
      # never connects; the tests set their own values (test/helpers/env.ts).
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
      JWT_SECRET: ci-only-dummy-jwt-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build # prisma generate + tsc (strict); generates the client the tests import
      - run: npm test

  web:
    name: Web (typecheck + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build

  app:
    name: Flutter app (analyze + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with tools/flutter (the SDK used for local builds).
          flutter-version: 3.44.2
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # lib + test only: third_party/ holds vendored forks with upstream lint debt.
      - run: flutter analyze --no-fatal-infos lib test
      - run: flutter test
