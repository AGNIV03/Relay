name: stream_app
description: "Self-hosted music streaming client (Windows / Android / web)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # Audio playback + background controls (Android / iOS / macOS / web)
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.13
  # Windows/Linux desktop audio backend for just_audio. NOTE: this also pulls a
  # large Android NDK + libmpv binaries into Android builds it never uses, so for
  # a lean *mobile-only* APK you can comment these two out (and the desktop init
  # in main.dart). They are required for the Windows .exe to play audio.
  just_audio_media_kit: ^2.0.6
  media_kit_libs_audio: ^1.0.5

  # State management
  provider: ^6.1.2

  # Local persistence + downloads
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Modern, minimal icon set (Material Symbols — rounded/outlined, transparent strokes).
  # Aliased to Lucide-style names in lib/app_icons.dart.
  material_symbols_icons: ^4.2719.0

  # Desktop window control + system-tray (close button hides to the tray instead
  # of quitting; quit from the tray's right-click menu).
  window_manager: ^0.4.3
  tray_manager: ^0.5.0

  # Pick local audio files to upload (desktop + mobile).
  file_picker: ^8.1.4

# Patched just_audio_background: media notification shows prev/play/next only
# (no stop button). See third_party/just_audio_background.
dependency_overrides:
  just_audio_background:
    path: third_party/just_audio_background

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# App icons generated from the Relay logo (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#0A0A0B"
  adaptive_icon_foreground: "assets/icon/logo_padded.png"
  remove_alpha_ios: false
  windows:
    generate: true
    image_path: "assets/icon/logo.png"
    icon_size: 256
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    - assets/logo.png
